<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Little Heart World</title>
  <style>
    :root { --floor-height: 112px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "Trebuchet MS", system-ui, sans-serif;
      background: linear-gradient(180deg, #9daeff 0%, #c6a5ff 52%, #f28ee0 100%);
      color: #fff;
    }
    .world { position: relative; width: 100%; height: 100dvh; overflow: hidden; isolation: isolate; }
    .sky-glow {
      position: absolute; inset: 0 0 var(--floor-height);
      background:
        radial-gradient(ellipse at 15% 40%, rgba(255,255,255,.22), transparent 28%),
        radial-gradient(ellipse at 85% 22%, rgba(255,255,255,.18), transparent 25%);
      z-index: -3;
    }
    .cloud {
      position: absolute; width: clamp(220px, 35vw, 510px); height: 100px;
      background: #fffaf9; border-radius: 55px; opacity: .96;
      filter: drop-shadow(0 5px 0 #ffd36d);
      z-index: -2;
    }
    .cloud::before, .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
    .cloud::before { width: 43%; height: 150%; left: 12%; bottom: 10%; }
    .cloud::after { width: 52%; height: 185%; right: 12%; bottom: 0; }
    .cloud.one { top: 18%; left: 5%; transform: scale(.9); }
    .cloud.two { top: 39%; right: 3%; transform: scale(1.05); }
    .cloud.three { top: 55%; left: 37%; transform: scale(.58); opacity:.8; }
    .balloon-layer { position:absolute; inset:0; pointer-events:none; z-index:-1; }
    .balloon {
      --size: 54px; --drift: 35px; --duration: 13s;
      position:absolute; bottom:-100px; left:var(--left); width:var(--size); height:calc(var(--size) * 1.12);
      border-radius: 52% 48% 48% 48%; background:var(--color, #ef2850);
      transform: rotate(12deg); opacity:.95;
      box-shadow: inset -8px -9px 0 rgba(130,0,35,.12), inset 7px 7px 0 rgba(255,255,255,.23);
      animation: rise var(--duration) linear infinite;
      animation-delay:var(--delay, 0s);
    }
    .balloon::before { content:""; position:absolute; width:20%; height:20%; top:10%; left:18%; border-radius:50%; background:rgba(255,255,255,.23); transform:rotate(-30deg); }
    .balloon::after { content:""; position:absolute; left:48%; top:98%; height:48px; width:1px; background:rgba(255,255,255,.7); transform:rotate(-4deg); transform-origin:top; }
    @keyframes rise {
      0% { transform:translate(0, 0) rotate(10deg); }
      50% { transform:translate(var(--drift), -58vh) rotate(-8deg); }
      100% { transform:translate(calc(var(--drift) * -0.45), -125vh) rotate(9deg); }
    }
    .heart {
      position:absolute; left:var(--x); top:var(--y); color:var(--c,#ef2552);
      font-size:var(--s, 60px); line-height:1; opacity:.94;
      text-shadow: 2px 3px 0 rgba(130,0,45,.14), inset 0 0 5px white;
      animation: heartBob 3.5s ease-in-out infinite;
      animation-delay:var(--delay,0s); user-select:none;
    }
    @keyframes heartBob { 0%,100%{transform:translateY(0) rotate(-7deg)} 50%{transform:translateY(-13px) rotate(6deg)} }
    .title {
      position:absolute; top:7%; left:50%; transform:translateX(-50%);
      width:max-content; max-width:90%; text-align:center; z-index:2;
      color:#fff; text-shadow:0 3px 0 #d75ba8, 0 6px 16px rgba(115,40,140,.3);
      font-size:clamp(22px,4vw,42px); letter-spacing:.04em;
    }
    .subtitle { display:block; margin-top:7px; font-size:clamp(12px,1.5vw,16px); letter-spacing:.12em; }
    .arch {
      position:absolute; left:50%; bottom:var(--floor-height); transform:translateX(-50%);
      width:min(45vw, 520px); height:min(42vh, 330px); min-width:280px;
      border:14px solid rgba(255,255,255,.82); border-bottom:0; border-radius:18px 18px 0 0;
      box-shadow: inset 0 0 0 5px rgba(246,151,224,.8), 0 0 0 3px rgba(187,94,205,.45);
      opacity:.85; pointer-events:none;
    }
    .arch::before {
      content:""; position:absolute; inset:0;
      background:repeating-linear-gradient(90deg, transparent 0 42px, rgba(255,255,255,.12) 42px 46px),
                 repeating-linear-gradient(0deg, transparent 0 42px, rgba(255,255,255,.12) 42px 46px);
    }
    .platform {
      position:absolute; bottom:0; left:0; right:0; height:var(--floor-height);
      border-top:7px solid #fff; background:repeating-linear-gradient(90deg,#fff7fd 0 63px,#eeb5e5 64px 68px),
      linear-gradient(#f7c9ee,#f7c9ee);
      box-shadow:0 -5px 0 rgba(221,111,202,.35);
    }
    .platform::before {
      content:""; position:absolute; left:0; right:0; top:0; height:58px;
      background:repeating-linear-gradient(90deg, transparent 0 62px, #dedde8 63px 67px),
                  repeating-linear-gradient(0deg, #fff 0 58px, #dddce8 59px 64px);
      border-bottom:5px solid #e5a8da;
    }
    .platform::after {
      content:""; position:absolute; left:0; right:0; bottom:0; height:48px;
      background:repeating-linear-gradient(135deg,#6c607a 0 8px,#8a7d96 8px 13px,#6c607a 13px 19px);
      border-top:5px solid #b48ab8;
    }
    .couple-track { position:absolute; left:5%; right:5%; bottom:calc(var(--floor-height) + 54px); height:116px; }
    .character {
      position:absolute; bottom:0; width:54px; height:88px;
      animation: walkAcross 13s linear infinite alternate;
      filter: drop-shadow(0 3px 1px rgba(70,30,90,.2));
    }
    .character.girl { animation-delay:-6.5s; animation-direction:alternate-reverse; }
    .head {
      position:absolute; top:0; left:11px; width:33px; height:34px; border-radius:45% 45% 48% 48%;
      background:#ffe0c7; border:3px solid #45364f; z-index:3;
    }
    .hair {
      position:absolute; top:-5px; left:7px; width:40px; height:30px; border-radius:50% 50% 25% 25%;
      background:#29253c; z-index:4; border:2px solid #43324f;
    }
    .face { position:absolute; top:14px; left:19px; z-index:5; color:#49304c; font-size:12px; letter-spacing:4px; }
    .body {
      position:absolute; top:31px; left:8px; width:40px; height:37px;
      background:#8dd6ff; border:3px solid #493954; border-radius:10px 10px 7px 7px; z-index:2;
    }
    .legs { position:absolute; bottom:0; left:14px; width:28px; height:23px; border-left:7px solid #493954; border-right:7px solid #493954; }
    .shoes { position:absolute; bottom:-2px; left:9px; width:18px; height:7px; border-radius:8px; background:#fff; box-shadow:19px 0 #fff; }
    .girl .hair { background:#5b304c; width:46px; height:42px; left:4px; border-radius:48% 48% 35% 35%; }
    .girl .hair::after { content:""; position:absolute; right:-3px; top:12px; width:11px; height:38px; border-radius:0 0 8px 8px; background:#5b304c; border:2px solid #43324f; }
    .girl .body { background:#ff91c9; }
    .boy .body { background:#8bd9ff; }
    .girl .head { left:10px; }
    .girl .face { left:18px; }
    .name-tag {
      position:absolute; bottom:94px; left:50%; transform:translateX(-50%); white-space:nowrap;
      font-size:12px; font-weight:bold; color:#fff; text-shadow:1px 2px #b84fa2;
    }
    @keyframes walkAcross { from { left:0; } to { left:calc(100% - 60px); } }
    .hint {
      position:absolute; left:50%; bottom:calc(var(--floor-height) + 8px); transform:translateX(-50%);
      color:#fff; font-size:11px; letter-spacing:.12em; opacity:.8; white-space:nowrap;
      text-shadow:1px 2px 3px #a54caa;
    }
    @media (max-width:600px) {
      :root { --floor-height: 88px; }
      .arch { width:75vw; height:30vh; min-width:0; border-width:9px; }
      .couple-track { left:3%; right:3%; bottom:calc(var(--floor-height) + 42px); }
      .character { transform:scale(.85); transform-origin:bottom center; }
      .cloud.one { top:22%; left:-15%; }
      .cloud.two { top:43%; right:-30%; }
      .hint { bottom:calc(var(--floor-height) + 3px); font-size:9px; }
    }
  </style>
</head>
<body>
  <main class="world">
    <div class="sky-glow"></div>
    <div class="cloud one"></div><div class="cloud two"></div><div class="cloud three"></div>
    <div class="title">OUR LITTLE WORLD<span class="subtitle">a tiny place full of love ♡</span></div>
    <div class="heart" style="--x:4%;--y:23%;--s:55px;--c:#c91538;--delay:-1s">♥</div>
    <div class="heart" style="--x:18%;--y:12%;--s:78px;--c:#f36ab2;--delay:-2s">♥</div>
    <div class="heart" style="--x:70%;--y:13%;--s:72px;--c:#d51536;--delay:-.4s">♥</div>
    <div class="heart" style="--x:83%;--y:39%;--s:82px;--c:#c91637;--delay:-1.6s">♥</div>
    <div class="heart" style="--x:13%;--y:54%;--s:66px;--c:#f36ab2;--delay:-.7s">♥</div>
    <div class="heart" style="--x:91%;--y:66%;--s:48px;--c:#f36ab2;--delay:-2.4s">♥</div>
    <div class="balloon-layer" id="balloons"></div>
    <div class="arch"></div>
    <div class="couple-track">
      <div class="character boy">
        <span class="name-tag">PROM</span><div class="hair"></div><div class="head"></div><div class="face">• •</div><div class="body"></div><div class="legs"></div><div class="shoes"></div>
      </div>
      <div class="character girl">
        <span class="name-tag">JIB</span><div class="hair"></div><div class="head"></div><div class="face">• •</div><div class="body"></div><div class="legs"></div><div class="shoes"></div>
      </div>
    </div>
    <div class="hint">♡ FLOATING HEARTS · LITTLE ADVENTURES · FOREVER ♡</div>
    <div class="platform"></div>
  </main>
  <script>
    const layer = document.getElementById('balloons');
    const colors = ['#ef2850', '#f36ab2', '#d9143b', '#ff8ec8'];
    // Create a fresh balloon every 650ms; each one rises independently.
    function addBalloon() {
      const balloon = document.createElement('span');
      balloon.className = 'balloon';
      balloon.style.setProperty('--left', `${Math.random() * 100}%`);
      balloon.style.setProperty('--size', `${34 + Math.random() * 43}px`);
      balloon.style.setProperty('--color', colors[Math.floor(Math.random() * colors.length)]);
      balloon.style.setProperty('--duration', `${10 + Math.random() * 8}s`);
      balloon.style.setProperty('--drift', `${Math.round(Math.random() * 90 - 45)}px`);
      layer.appendChild(balloon);
      setTimeout(() => balloon.remove(), 19000);
    }
    for (let i = 0; i < 16; i++) {
      addBalloon();
      // Spread the first wave vertically so the scene is lively immediately.
      const item = layer.lastElementChild;
      item.style.animationDelay = `${-Math.random() * 16}s`;
    }
    setInterval(addBalloon, 650);
  </script>
</body>
</html>
